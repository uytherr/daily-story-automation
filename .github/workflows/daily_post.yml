name: Daily Automatic Horror Shorts (3x Daily)

on:
  workflow_dispatch:
  schedule:
    # 3 Optimal Viral Times for YouTube Shorts:
    # 1. 06:00 UTC (11:30 AM IST / 2:00 AM EST - Early Morning Scroll)
    # 2. 15:00 UTC (8:30 PM IST / 11:00 AM EST - Evening Primetime Peak)
    # 3. 22:00 UTC (3:30 AM IST / 6:00 PM EST - Late Night Horror Wave)
    - cron: '0 6 * * *'
    - cron: '0 15 * * *'
    - cron: '0 22 * * *'

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Main Generation Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py

      - name: Save Video to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: horror-story-${{ github.run_id }}
          path: final_short.mp4
          
